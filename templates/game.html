{{define "title"}}Partie #{{.Game.ID}} · Puissance 4{{end}}

{{define "content"}}
<div class="game" id="game" data-id="{{.Game.ID}}">
  <div class="game-top">
    <a href="/" class="back">← Salon</a>
    <span class="muted mono">Partie #{{.Game.ID}}</span>
  </div>

  <div class="players">
    <div class="player p1" id="player1">
      <span class="token p1"></span>
      <span class="player-name" id="p1-name">{{.Game.P1Name}}</span>
    </div>
    <span class="vs">VS</span>
    <div class="player p2" id="player2">
      <span class="token p2"></span>
      <span class="player-name" id="p2-name">{{if .Game.P2Name}}{{.Game.P2Name}}{{else}}…{{end}}</span>
    </div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">Chargement…</p>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="Grille de jeu"></div>
  </div>

  <div class="share" id="share" hidden>
    <p>Envoyez ce lien à votre adversaire :</p>
    <div class="share-row">
      <input type="text" id="share-link" readonly>
      <button type="button" class="btn btn-ghost btn-sm" id="copy-link">Copier</button>
    </div>
  </div>

  <div class="actions">
    <form method="post" action="/games/{{.Game.ID}}/join" id="join-form" hidden>
      <button type="submit" class="btn btn-primary">Rejoindre la partie</button>
    </form>
    <form method="post" action="/games" id="new-form" hidden>
      <button type="submit" class="btn btn-primary">Nouvelle partie</button>
    </form>
    <form method="post" action="/games/{{.Game.ID}}/forfeit" id="forfeit-form" hidden>
      <button type="submit" class="btn btn-ghost" id="forfeit-btn">Abandonner</button>
    </form>
  </div>
</div>
{{end}}

{{define "scripts"}}<script src="/static/game.js"></script>{{end}}
